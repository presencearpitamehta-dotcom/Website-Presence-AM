# Netlify configuration for arpitamehta.co
[build]
  publish = "."
  command = "node update-sitemap-date.js"

# internal-docs/ holds business files kept in git for history only (the
# diagnosis-plan template/example, the recovery guide, the automation
# plan, the site log). They must never be reachable on the live site,
# so block the whole path with a hard 404 rather than relying on the
# fact that nothing links to it.
[[redirects]]
  from = "/internal-docs/*"
  to = "/404.html"
  status = 404
  force = true

# Working files that live in the repo for version history but have no
# business being served. Nothing links to them, but "unlinked" is not
# "private": each was reachable by typing its URL.
#   - the quest tracker carries the leads-sheet URL, the contact email
#     and the whole launch plan
#   - the two Apps Script files are the source of the lead-handling and
#     client-document automation, including the email templates
#   - scripts/ and the build script are internal tooling
# llm-markdown/ is deliberately NOT blocked: llms.txt points AI crawlers
# at it, so it is meant to be public.
[[redirects]]
  from = "/launch-sequence-quest-tracker.html"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/enquiry-autoresponder.gs"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/diagnosis-plan-sender.gs"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/update-sitemap-date.js"
  to = "/404.html"
  status = 404
  force = true

# book-a-call.html was briefly live under its old name before being
# renamed to booking.html. Permanent redirect so any link already shared
# (ads, bio, WhatsApp) or indexed by Google still lands on the right page.
[[redirects]]
  from = "/book-a-call.html"
  to = "/booking.html"
  status = 301
  force = true
[[redirects]]
  from = "/book-a-call"
  to = "/booking.html"
  status = 301
  force = true

# Serve the clean, no-extension URL (arpitamehta.co/booking) rather than
# relying on Netlify's default .html handling. A rewrite (200), not a
# redirect, so the address bar keeps showing /booking.
[[redirects]]
  from = "/booking"
  to = "/booking.html"
  status = 200

# Security headers (brief section 9) applied to every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Long cache for static assets, images and the PDF
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
