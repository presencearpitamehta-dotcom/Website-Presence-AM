<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found — Arpita Mehta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --linen:#F8F4EE;
    --ink:#2A1F14;
    --brown:#9C5A4C;
    --gold:#AE957E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--linen);
    color:var(--ink);
    font-family:'DM Sans',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  .wrap{max-width:440px}
  h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:2rem;
    margin-bottom:12px;
  }
  p{font-size:1rem;color:var(--brown);margin-bottom:28px;line-height:1.6}
  a.home{
    display:inline-block;
    padding:12px 28px;
    border:1px solid var(--gold);
    border-radius:4px;
    color:var(--ink);
    text-decoration:none;
    font-size:.92rem;
    letter-spacing:.02em;
  }
  a.home:hover{background:var(--gold);color:var(--linen)}
</style>
</head>
<body>
  <div class="wrap">
    <h1>This page can't be found</h1>
    <p>The link may be outdated, or the page has moved. Let's get you back on track.</p>
    <a class="home" href="/">Return to the homepage</a>
  </div>
</body>
</html>
