<title>The Launch Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap">
<style>
/* 60-30-10: graphite ground, slate structure, one brass accent. World tints appear only on the
   world you are in. Layout: pick a world, then a single trail fills the screen. */
:root{
  --bg:#F5F3EF;            /* 60 */
  --surface:#FFFFFF;       /* 30 */
  --surface-2:#EDEAE4;
  --line:#DAD5CC;
  --line-soft:#E7E3DB;
  --fg:#1F2127;
  --fg-dim:#5E6472;
  --fg-faint:#8C919C;
  --accent:#B9792A;        /* 10 */
  --accent-soft:rgba(185,121,42,.11);
  --ok:#3F8A62;
  --w:#B5543F; --w-soft:rgba(181,84,63,.11);
  --disp:"Fredoka","Trebuchet MS",sans-serif;
  --ui:"Outfit","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.3,1);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 480px at 50% -12%, rgba(185,121,42,.09), transparent 70%)}
h1,h2,h3{font-family:var(--disp);font-weight:600;margin:0;text-wrap:balance}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 100px}

/* ---------- header ---------- */
.hud{display:flex;align-items:center;gap:14px;padding-block:22px 16px}
.mono{flex:0 0 auto;width:46px;height:46px;border-radius:14px;background:#FFFFFF;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.mono img{width:34px;height:auto;display:block}
.hud-mid{flex:1 1 auto;min-width:0}
.hud-mid h1{font-size:1.32rem;line-height:1.1;letter-spacing:-.01em}
.hud-mid p{margin:4px 0 0;font-size:.78rem;color:var(--fg-dim)}
.hud-mid p b{color:var(--accent);font-weight:500}
.donut{flex:0 0 auto;position:relative;width:60px;height:60px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.donut .dt{fill:none;stroke:var(--line);stroke-width:6}
.donut .db{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .9s var(--ease)}
.donut b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:.84rem;font-variant-numeric:tabular-nums}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:26px}
.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:13px;padding:11px 12px;transition:border-color .3s var(--ease)}
.stat:hover{border-color:var(--line)}
.stat b{display:block;font-family:var(--disp);font-size:1.18rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{display:block;font-size:.67rem;color:var(--fg-faint);letter-spacing:.05em;margin-top:3px}
.stat.on b{color:var(--accent)}

.snd{position:absolute;top:28px;right:max(16px,env(safe-area-inset-right,0px));width:32px;height:32px;border-radius:10px;
  background:transparent;border:1px solid var(--line);color:var(--fg-faint);display:grid;place-items:center;
  transition:all .3s var(--ease);z-index:3}
.snd:hover{color:var(--accent);border-color:var(--accent)}
.snd svg{width:15px;height:15px}

/* ---------- picker ---------- */
.lead{margin:0 0 14px;color:var(--fg-dim);font-size:.88rem}
.lead b{color:var(--fg);font-weight:500}
.wgrid{display:grid;gap:10px}
.wwrap{position:relative}
.wcard{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line-soft);border-left:3px solid var(--w);border-radius:15px;padding:14px 15px;
  transition:transform .3s var(--ease),border-color .3s var(--ease),background .3s var(--ease)}
.wcard:hover{transform:translateX(3px);background:var(--surface-2);border-color:var(--line);border-left-color:var(--w)}
.wcard:active{transform:translateX(1px) scale(.995)}
.wcard.clear{opacity:.5}
.wic{flex:0 0 auto;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  background:var(--w-soft);color:var(--w);transition:transform .3s var(--ease)}
.wcard:hover .wic{transform:scale(1.07)}
.wic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wtx{flex:1 1 auto;min-width:0}
.wn{margin:0;font-size:.63rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-faint);font-weight:500}
.wtx h3{font-size:1.1rem;line-height:1.2;margin:3px 0 7px;letter-spacing:-.01em}
.tiles{display:flex;gap:5px}
.tile{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-family:var(--disp);
  font-size:.62rem;font-weight:600;color:#FFFFFF;letter-spacing:-.02em}
.wmeter{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:46px}
.wmeter b{font-family:var(--disp);font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--fg-dim)}
.wmeter .seg{display:flex;gap:2px}
.wmeter .seg i{width:5px;height:5px;border-radius:2px;background:var(--line);transition:background .4s var(--ease)}
.wmeter .seg i.f{background:var(--w)}
.herebadge{position:absolute;top:-6px;left:16px;z-index:2;font-size:.55rem;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;background:var(--accent);color:#FFFFFF;border-radius:5px;padding:3px 8px}

/* ---------- world ---------- */
.back{display:inline-flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--line);
  color:var(--fg-dim);border-radius:10px;padding:7px 13px;font-size:.78rem;margin-bottom:18px;transition:all .3s var(--ease)}
.back:hover{color:var(--fg);border-color:var(--fg-faint);transform:translateX(-2px)}
.whead{margin-bottom:20px}
.whead h2{font-size:2rem;line-height:1.05;margin:5px 0 7px;letter-spacing:-.02em}
.wsub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.76rem;color:var(--fg-faint)}
.wbar{height:5px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-top:14px}
.wbar i{display:block;height:100%;width:0;background:var(--w);border-radius:99px;transition:width .8s var(--ease)}
.crown{display:none;align-items:center;gap:7px;margin-top:11px;font-family:var(--disp);font-size:.76rem;font-weight:600;color:var(--accent)}
.world.clear .crown{display:inline-flex}

.trail{position:relative;margin:0 auto}
.tsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.tbase{fill:none;stroke:var(--line-soft);stroke-width:11;stroke-linecap:round}
.tfill{fill:none;stroke:var(--w);stroke-width:6;stroke-linecap:round;opacity:.85;transition:stroke-dashoffset .9s var(--ease)}

.node{position:absolute;width:132px;transform:translateX(-50%);text-align:center}
.orbwrap{height:88px;display:grid;place-items:center}
.orb{position:relative;width:68px;height:68px;border-radius:21px;background:var(--surface);border:1px solid var(--line);
  color:var(--fg-faint);display:grid;place-items:center;padding:0;transition:all .3s var(--ease)}
.orb:hover{transform:translateY(-3px);border-color:var(--w);color:var(--w)}
.orb:active{transform:translateY(0) scale(.96)}
.orb svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.orb-ck{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:scale(.5);transition:all .35s var(--ease)}
.orb-ck svg{width:30px;height:30px;stroke-width:2.6;stroke:#FFFFFF}
.orb-ic{display:grid;place-items:center;transition:all .3s var(--ease)}
.node.boss .orb{width:84px;height:84px;border-radius:26px}
.node.boss .orb svg{width:33px;height:33px}
.node.now .orb{border-color:var(--w);color:var(--w);background:var(--w-soft);box-shadow:0 0 0 4px var(--w-soft)}
.node.now .orb::after{content:"";position:absolute;inset:-7px;border-radius:26px;border:1px solid var(--w);opacity:.4;animation:halo 2.4s ease-out infinite}
@keyframes halo{0%{transform:scale(.96);opacity:.45}100%{transform:scale(1.14);opacity:0}}
.node.done .orb{background:var(--w);border-color:var(--w);color:#FFFFFF}
.node.done .orb .orb-ic{opacity:0;transform:scale(.5)}
.node.done .orb-ck{opacity:1;transform:scale(1)}
.nlabel{display:block;margin-top:5px;font-family:var(--disp);font-weight:500;font-size:.78rem;line-height:1.2;color:var(--fg-dim);transition:color .3s var(--ease)}
.node.now .nlabel{color:var(--fg)}
.node.done .nlabel{color:var(--fg-faint)}
.bosstag{display:block;font-size:.54rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-top:2px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,11,14,.76);backdrop-filter:blur(4px);opacity:0;transition:opacity .3s var(--ease)}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:51;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--surface);
  border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;
  padding:8px 20px calc(22px + env(safe-area-inset-bottom,0px));
  transform:translateY(102%);transition:transform .4s var(--ease);max-height:88vh;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 16px}
.s-head{display:flex;gap:13px;align-items:center;margin-bottom:12px}
.s-ic{flex:0 0 auto;width:50px;height:50px;border-radius:15px;background:var(--w-soft);color:var(--w);display:grid;place-items:center}
.s-ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.s-head h3{font-size:1.24rem;line-height:1.15;letter-spacing:-.01em}
.schips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:15px;align-items:center}
.schip{font-size:.69rem;font-weight:500;padding:4px 10px;border-radius:7px;background:var(--surface-2);color:var(--fg-dim);border:1px solid var(--line-soft);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.schip.xp{background:var(--accent-soft);color:var(--accent);border-color:rgba(233,161,59,.3);font-family:var(--disp);font-weight:600}
.schip.me{background:var(--w-soft);color:var(--w);border-color:var(--w)}
.schip .tile{width:17px;height:17px;border-radius:5px;font-size:.55rem}
.s-why{margin:0 0 16px;font-size:.9rem;color:var(--fg);background:var(--surface-2);border-left:2px solid var(--w);border-radius:0 10px 10px 0;padding:11px 14px}
.s-steps{list-style:none;margin:0 0 18px;padding:0;counter-reset:n}
.s-steps li{counter-increment:n;display:flex;gap:11px;align-items:flex-start;font-size:.87rem;color:var(--fg-dim);margin-bottom:10px}
.s-steps li::before{content:counter(n);flex:0 0 auto;width:21px;height:21px;border-radius:6px;background:var(--surface-2);
  border:1px solid var(--line-soft);color:var(--w);font-family:var(--disp);font-weight:600;font-size:.65rem;display:grid;place-items:center;margin-top:1px}
.s-steps code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em;background:var(--bg);padding:1px 6px;border-radius:5px;color:var(--fg);word-break:break-word}
.s-acts{display:flex;gap:9px;flex-wrap:wrap}
.b{flex:1 1 150px;font-family:var(--disp);font-weight:600;font-size:.87rem;border:0;border-radius:12px;padding:13px 18px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .3s var(--ease);text-decoration:none}
.b.go{background:var(--accent);color:#FFFFFF}
.b.go:hover{filter:brightness(1.08)}
.b.go:active{transform:scale(.97)}
.b.alt{background:transparent;color:var(--fg-dim);border:1px solid var(--line)}
.b.alt:hover{color:var(--fg);border-color:var(--fg-faint)}
.b.alt:active{transform:scale(.97)}

#fx{position:fixed;inset:0;z-index:70;pointer-events:none}
.toast{position:fixed;z-index:80;left:50%;top:24%;transform:translate(-50%,-10px) scale(.9);opacity:0;
  background:var(--accent);color:#FFFFFF;font-family:var(--disp);font-weight:700;font-size:1.3rem;
  padding:15px 30px;border-radius:16px;text-align:center;
  transition:all .45s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.toast small{display:block;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;opacity:.7;font-weight:600}
.foot{text-align:center;color:var(--fg-faint);font-size:.73rem;margin-top:28px}
.sync{display:inline-flex;align-items:center;gap:7px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.sync.off i{background:var(--fg-faint)} .sync.err i{background:#C9654F}

@media (max-width:420px){.node{width:112px}.nlabel{font-size:.73rem}.whead h2{font-size:1.65rem}.stat b{font-size:1.05rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <button class="snd" id="sndBtn" type="button" aria-label="Toggle sound">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" id="sndIcon">
      <path d="M11 5L6.5 9H3v6h3.5L11 19V5z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/>
    </svg>
  </button>

  <header class="hud">
    <div class="mono"><img src="monogram.png" alt="Arpita Mehta monogram"></div>
    <div class="hud-mid">
      <h1>The Launch Quest</h1>
      <p><b id="lvlName">Getting started</b> &middot; <span id="lvlNum">Level 1</span></p>
    </div>
    <div class="donut">
      <svg viewBox="0 0 64 64"><circle class="dt" cx="32" cy="32" r="27"></circle>
      <circle class="db" id="donutBar" cx="32" cy="32" r="27" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"></circle></svg>
      <b id="pctTxt">0%</b>
    </div>
  </header>

  <div class="stats">
    <div class="stat" id="stW"><b id="stWorlds">0/7</b><span>WORLDS</span></div>
    <div class="stat" id="stS"><b id="stSteps">0/46</b><span>STEPS</span></div>
    <div class="stat on"><b id="stXp">0</b><span>XP</span></div>
  </div>

  <div id="view"></div>
  <p class="foot"><span class="sync" id="sync"><i></i><span id="syncTxt">Connecting…</span></span></p>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <div class="grip"></div>
  <div class="s-head"><div class="s-ic" id="sIc"></div><h3 id="sTitle"></h3></div>
  <div class="schips" id="sChips"></div>
  <p class="s-why" id="sWhy"></p>
  <ol class="s-steps" id="sSteps"></ol>
  <div class="s-acts" id="sActs"></div>
</aside>
<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>

function burst(x,y,cols,n){if(RM)return;for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,sp=3+Math.random()*9;bits.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-5.5,c:cols[i%cols.length],s:3+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,life:1})}if(!raf)raf=requestAnimationFrame(tick)}
function tick(){ctx.clearRect(0,0,innerWidth,innerHeight);for(var i=bits.length-1;i>=0;i--){var p=bits[i];p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;p.life-=.012;if(p.life<=0||p.y>innerHeight+60){bits.splice(i,1);continue}ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62);ctx.restore()}if(bits.length)raf=requestAnimationFrame(tick);else{raf=null;ctx.clearRect(0,0,innerWidth,innerHeight)}}
var tT=null;
function toast(b,s){var el=$("toast");el.innerHTML='<small>'+s+'</small>'+b;el.classList.add("on");clearTimeout(tT);tT=setTimeout(function(){el.classList.remove("on")},2100)}

function stepsOf(id){return S.filter(function(s){return s.w===id})}
function nextStep(){for(var i=0;i<S.length;i++)if(!done[S[i].id])return S[i];return null}
function tiles(list){return list.map(function(k){var t=TOOL[k];return t?'<span class="tile" style="background:'+t.c+'" title="'+t.n+'">'+t.l+'</span>':''}).join('')}

function renderHome(){
  var nx=nextStep(),nw=nx?nx.w:null,h='';
  h+='<p class="lead">'+(nx?'What are you working on today? <b>'+world(nw).name+'</b> is where you left off.':'Every world is clear.')+'</p><div class="wgrid">';
  WORLDS.forEach(function(w){
    var mine=stepsOf(w.id),n=mine.filter(function(s){return !!done[s.id]}).length;
    var segs='';for(var i=0;i<mine.length;i++)segs+='<i class="'+(i<n?'f':'')+'"></i>';
    h+='<div class="wwrap">'+(w.id===nw?'<span class="herebadge">Start here</span>':'')
     +'<button class="wcard'+(n===mine.length?' clear':'')+'" data-w="'+w.id+'" style="--w:'+w.c+';--w-soft:'+w.s+'">'
     +'<span class="wic"><svg viewBox="0 0 24 24">'+I[w.ic]+'</svg></span>'
     +'<span class="wtx"><p class="wn">'+w.n+' &middot; '+w.when+'</p><h3>'+w.name+'</h3><span class="tiles">'+tiles(w.tools)+'</span></span>'
     +'<span class="wmeter"><b>'+n+'/'+mine.length+'</b><span class="seg">'+segs+'</span></span>'
     +'</button></div>';
  });
  h+='</div>';
  $("view").innerHTML=h;
}

function renderWorld(id){
  var w=world(id); if(!w) return renderHome();
  var mine=stepsOf(id);
  var h='<button class="back" id="backBtn">&larr; All worlds</button>'
   +'<section class="world" id="wo-'+w.id+'" style="--w:'+w.c+';--w-soft:'+w.s+'">'
   +'<div class="whead"><p class="wn">'+w.n+'</p><h2>'+w.name+'</h2>'
   +'<div class="wsub"><span>'+w.when+'</span><span class="tiles">'+tiles(w.tools)+'</span></div>'
   +'<div class="wbar"><i id="wb-'+w.id+'"></i></div>'
   +'<span class="crown"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+I.cup+'</svg>World cleared</span></div>'
   +'<div class="trail" id="tr-'+w.id+'" style="height:'+(mine.length*130+52)+'px">'
   +'<svg class="tsvg"><path class="tbase" id="tb-'+w.id+'"/><path class="tfill" id="tf-'+w.id+'" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>';
  mine.forEach(function(s,i){
    h+='<div class="node'+(s.boss?' boss':'')+'" id="nd-'+s.id+'" style="left:'+XPAT[i%4]+'%;top:'+(i*130)+'px">'
     +'<div class="orbwrap"><button class="orb" type="button" data-s="'+s.id+'" aria-label="'+esc(s.t)+'">'
     +'<span class="orb-ic"><svg viewBox="0 0 24 24">'+I[s.ic]+'</svg></span><span class="orb-ck">'+CHECK+'</span></button></div>'
     +'<span class="nlabel">'+s.t+(s.boss?'<span class="bosstag">Boss</span>':'')+'</span></div>';
  });
  h+='</div></section>';
  $("view").innerHTML=h;
  $("backBtn").addEventListener("click",function(){go(null)});
  requestAnimationFrame(function(){drawTrail(id);paintWorld(id)});
}

function curve(p){if(!p.length)return"";var d="M"+p[0][0].toFixed(1)+" "+p[0][1].toFixed(1);for(var i=1;i<p.length;i++){var a=p[i-1],b=p[i],k=(b[1]-a[1])*.5;d+=" C"+a[0].toFixed(1)+" "+(a[1]+k).toFixed(1)+","+b[0].toFixed(1)+" "+(b[1]-k).toFixed(1)+","+b[0].toFixed(1)+" "+b[1].toFixed(1)}return d}
function drawTrail(id){
  var box=$("tr-"+id); if(!box)return;
  var W=box.clientWidth,mine=stepsOf(id);
  var pts=mine.map(function(s,i){return [W*XPAT[i%4]/100,i*130+44]});
  var d=curve(pts);
  ["tb-","tf-"].forEach(function(p){var el=$(p+id);if(el)el.setAttribute("d",d)});
}
function paintWorld(id){
  var mine=stepsOf(id),n=0,first=nextStep();
  mine.forEach(function(s){
    var isd=!!done[s.id]; if(isd)n++;
    var el=$("nd-"+s.id); if(!el)return;
    el.classList.toggle("done",isd);
    el.classList.toggle("now",!isd&&!!first&&first.id===s.id);
  });
  var f=mine.length?n/mine.length:0;
  var bar=$("wb-"+id); if(bar)bar.style.width=(f*100)+"%";
  var fill=$("tf-"+id); if(fill)fill.setAttribute("stroke-dashoffset",String(1-f));
  var sec=$("wo-"+id); if(sec)sec.classList.toggle("clear",n===mine.length&&mine.length>0);
}

function go(id){
  viewW=id;
  if(id){location.hash=id;renderWorld(id);window.scrollTo({top:0,behavior:RM?"auto":"smooth"})}
  else{if(location.hash)history.replaceState(null,"",location.pathname);renderHome()}
}
$("view").addEventListener("click",function(e){
  var w=e.target.closest("[data-w]"); if(w){tone(520,.09,"triangle",.04);go(w.getAttribute("data-w"));return}
  var b=e.target.closest("[data-s]"); if(b){openSheet(b.getAttribute("data-s"))}
});

function openSheet(id){
  var s=step(id); if(!s)return;
  cur=id;
  var w=world(s.w),sh=$("sheet");
  sh.style.setProperty("--w",w.c); sh.style.setProperty("--w-soft",w.s);
  $("sIc").innerHTML='<svg viewBox="0 0 24 24">'+I[s.ic]+'</svg>';
  $("sTitle").textContent=s.t;
  var t=TOOL[s.tool];
  $("sChips").innerHTML='<span class="schip xp">+'+s.xp+' XP</span>'
   +'<span class="schip'+(s.who==="Me"?" me":"")+'">'+s.who+'</span>'
   +'<span class="schip">'+s.m+'</span>'
   +(t?'<span class="schip"><span class="tile" style="background:'+t.c+'">'+t.l+'</span>'+t.n+'</span>':'')
   +(s.boss?'<span class="schip xp">Boss</span>':'');
  $("sWhy").innerHTML=s.why;
  $("sSteps").innerHTML=s.d.map(function(x){return "<li><span>"+x+"</span></li>"}).join("");
  var isDone=!!done[s.id];
  var acts='<button class="b go" type="button" id="sDone">'+(isDone?'Undo this':'Complete &middot; +'+s.xp+' XP')+'</button>';
  if(s.l)acts+='<a class="b alt" href="'+s.l.u+'" target="_blank" rel="noopener noreferrer">'+s.l.t+' &rarr;</a>';
  $("sActs").innerHTML=acts;
  $("sDone").addEventListener("click",function(){mark(s.id)});
  $("scrim").hidden=false; sh.hidden=false;
  requestAnimationFrame(function(){$("scrim").classList.add("on");sh.classList.add("on")});
  tone(520,.09,"triangle",.04);
}
function closeSheet(){$("scrim").classList.remove("on");$("sheet").classList.remove("on");setTimeout(function(){$("scrim").hidden=true;$("sheet").hidden=true},360);cur=null}
$("scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&cur)closeSheet()});

function hud(){
  var xp=0,n=0;
  S.forEach(function(s){if(done[s.id]){xp+=s.xp;n++}});
  var wc=WORLDS.filter(function(w){var m=stepsOf(w.id);return m.length&&m.every(function(s){return !!done[s.id]})}).length;
  var pct=Math.round(xp/TOTAL*100);
  var lvl=Math.min(TIERS.length,Math.floor(xp/(TOTAL/TIERS.length))+1);
  $("lvlNum").textContent="Level "+lvl;
  $("lvlName").textContent=TIERS[lvl-1];
  $("pctTxt").textContent=pct+"%";
  $("donutBar").setAttribute("stroke-dashoffset",String(100-pct));
  $("stWorlds").textContent=wc+"/"+WORLDS.length;
  $("stSteps").textContent=n+"/"+S.length;
  $("stXp").textContent=xp.toLocaleString();
  $("stW").classList.toggle("on",wc>0);
  $("stS").classList.toggle("on",n>0);
  if(ready&&lvl>lastLevel){fanfare();toast("Level "+lvl,"Level up");burst(innerWidth/2,innerHeight*.3,["#E9A13B","#C9654F","#EDEFF3","#4E9B78"],80)}
  lastLevel=lvl;
}
function repaint(){hud(); if(viewW)paintWorld(viewW); else renderHome()}
function setSync(c,t){$("sync").className="sync"+(c?" "+c:"");$("syncTxt").textContent=t}

async function mark(id){
  if(busy[id])return;
  var s=step(id); if(!s)return;
  if(!db){setSync("err","Not connected, that did not save");return}
  var next=!done[id];
  done[id]=next; if(!next)delete done[id];
  repaint();
  if(next){
    var el=$("nd-"+id),w=world(s.w);
    if(el){var r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+40,[w.c,"#E9A13B","#EDEFF3"],s.boss?70:38)}
    if(s.boss){fanfare();toast("+"+s.xp+" XP","Boss cleared")}
    else{tone(660,.09,"triangle",.05);setTimeout(function(){tone(880,.14,"triangle",.05)},85)}
  }else tone(220,.13,"sine",.04);
  closeSheet();
  busy[id]=true; setSync("","Saving…");
  try{
    if(next)await db.collection("progress").doc(id).set({done:true,at:new Date().toISOString()});
    else await db.collection("progress").doc(id).delete();
    setSync("","Progress saved");
  }catch(e){
    done[id]=!next; if(!done[id])delete done[id];
    repaint(); setSync("err","Could not save that");
  }finally{busy[id]=false}
}

var h0=(location.hash||"").replace("#","");
viewW=world(h0)?h0:null;
if(viewW)renderWorld(viewW); else renderHome();
hud();
window.addEventListener("resize",function(){if(viewW)drawTrail(viewW);sizeFx()});

(async function(){
  var d=null;
  try{d=await claude.use("db")}catch(e){d=null}
  if(!d){setSync("off","Progress is not saving in this view");ready=true;return}
  db=d; setSync("","Progress saved");
  db.collection("progress").onSnapshot(function(snap){
    var m={};
    snap.docs.forEach(function(doc){var v=doc.data();if(v&&v.done)m[doc.id]=true});
    done=m; repaint(); if(viewW)drawTrail(viewW); ready=true;
  },function(){setSync("err","Live sync stopped, reload the page")});
})();
</script>
